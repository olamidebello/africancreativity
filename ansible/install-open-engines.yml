# Installs and enables one engine at a time; preserves working engines on failure.
- name: Inspect hardware and choose supported engines before changing the app
  hosts: all
  become: true
  gather_facts: true
  vars:
    open_engines_requested:
    - whisper
    - kokoro
    - ace-step
    - wan
    - flux-schnell
    open_engines_require_all: false
    creativity_install: /opt/africancreativity
  tasks:
  - name: Validate selection and Python platform
    ansible.builtin.assert:
      that:
      - open_engines_requested is sequence and open_engines_requested is not string
      - open_engines_requested | length > 0
      - open_engines_requested | difference(['ace-step','wan','flux-schnell','kokoro','whisper']) | length == 0
      - ansible_facts.python.version.major == 3
      - ansible_facts.python.version.minor | int >= 10
      - ansible_facts.python.version.minor | int <= 12
      - creativity_install is match('^/opt/[A-Za-z0-9_-]+$')
      fail_msg: "This installation profile supports Debian/Ubuntu Python 3.10\u20133.12."
  - name: Inspect NVIDIA GPU memory without installing drivers
    ansible.builtin.command:
      argv:
      - nvidia-smi
      - --query-gpu=memory.total
      - --format=csv
      - noheader
      - nounits
    register: open_gpu
    failed_when: false
    changed_when: false
    check_mode: false
  - name: Choose engines that satisfy this conservative capacity profile
    ansible.builtin.set_fact:
      open_engines_selected: '{{ (open_engines_requested | intersect([''kokoro'',''whisper'']) if ansible_facts.memtotal_mb | int >= 3500 else
        []) + (open_engines_requested | intersect([''ace-step'',''wan'']) if open_gpu.rc == 0 and (open_gpu.stdout_lines | first | default(''0'')
        | int) >= 12000 and ansible_facts.memtotal_mb | int >= 31000 else []) + ([''flux-schnell''] if ''flux-schnell'' in open_engines_requested
        and open_gpu.rc == 0 and (open_gpu.stdout_lines | first | default(''0'') | int) >= 16000 and ansible_facts.memtotal_mb | int >= 47000
        else []) }}'
  - name: Report requested and supported engines
    ansible.builtin.debug:
      msg:
        requested: '{{ open_engines_requested }}'
        selected: '{{ open_engines_selected }}'
        skipped_for_capacity: '{{ open_engines_requested | difference(open_engines_selected) }}'
  - name: Require selected capacity before deploying
    ansible.builtin.assert:
      that:
      - not (open_engines_require_all | bool) or open_engines_requested | difference(open_engines_selected) | length == 0
      fail_msg: Insufficient hardware. Kokoro requires 4 GB RAM; ACE-Step/Wan use this profile's 12 GB GPU and 32 GB RAM minimum; FLUX uses 16
        GB GPU and 48 GB RAM. These are installer thresholds, not performance guarantees.
- name: Deploy latest application with existing database backup flow
  ansible.builtin.import_playbook: deploy-admin.yml
- name: Install isolated model runtimes and activate only verified outputs
  hosts: all
  become: true
  gather_facts: false
  vars:
    creativity_install: /opt/africancreativity
    creativity_port: 8096
    open_engines_root: /opt/africancreativity-open-engines
    open_engine_requirements:
      whisper: open-whisper.txt
      ace-step: open-ace-step.txt
      wan: open-diffusion.txt
      flux-schnell: open-diffusion.txt
      kokoro: open-kokoro.txt
  tasks:
  - name: Validate runtime destination
    ansible.builtin.assert:
      that: open_engines_root is match('^/opt/[A-Za-z0-9_-]+$')
  - name: Install OS prerequisites
    ansible.builtin.apt:
      name:
      - python3-venv
      - python3-dev
      - build-essential
      - git
      - ffmpeg
      - libsndfile1
      - espeak-ng
      - libgomp1
      state: present
      update_cache: true
  - name: Install runner directory
    ansible.builtin.file:
      path: '{{ creativity_install }}/deploy'
      state: directory
      mode: '0755'
  - name: Copy new model runner
    ansible.builtin.copy:
      src: '{{ playbook_dir }}/../deploy/run_open_engine.py'
      dest: '{{ creativity_install }}/deploy/run_open_engine.py'
      owner: root
      group: root
      mode: '0644'
      backup: true
  - name: Create protected shared model cache
    ansible.builtin.file:
      path: '{{ creativity_install }}/data/open-models'
      state: directory
      owner: africancreativity
      group: africancreativity
      mode: '0700'
  - name: Inspect previous engine manifest
    ansible.builtin.stat:
      path: '{{ creativity_install }}/open-engines.json'
    register: open_previous_stat
  - name: Read existing verified manifest
    ansible.builtin.slurp:
      src: '{{ creativity_install }}/open-engines.json'
    register: open_previous
    when: open_previous_stat.stat.exists
  - name: Preserve previously enabled engines
    ansible.builtin.set_fact:
      open_engine_manifest: '{{ (open_previous.content | b64decode | from_json) if open_previous_stat.stat.exists else {} }}'
      open_engine_report: {}
  - name: Validate existing manifest structure
    ansible.builtin.assert:
      that:
      - open_engine_manifest is mapping
      fail_msg: Existing engine manifest must be a JSON object; it was not overwritten.
  - name: Install and enable engines independently in CPU-first order
    ansible.builtin.include_tasks: tasks/repair-open-engine.yml
    loop: '{{ [''whisper'',''kokoro'',''ace-step'',''wan'',''flux-schnell''] | select(''in'', open_engines_requested | default([''whisper'',''kokoro'',''ace-step'',''wan'',''flux-schnell'']))
      | list }}'
    loop_control:
      loop_var: open_engine
  - name: Report each installation result
    ansible.builtin.debug:
      var: open_engine_report
  - name: Require all engines when explicitly selected
    ansible.builtin.assert:
      that: open_engine_report.values() | selectattr('state','ne','ready') | list | length == 0
      fail_msg: Some engines did not pass installation. Successfully verified engines remain enabled; inspect the per-engine report.
    when: open_engines_require_all | default(false) | bool
