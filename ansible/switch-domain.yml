---
- name: Switch Africa Creativity to its canonical HTTPS domain
  hosts: all
  become: true
  gather_facts: true
  vars:
    creativity_domain: olamideolatayobello.com
    creativity_backend_port: 8096
    creativity_install: /opt/africancreativity
    creativity_challenge_root: /var/lib/letsencrypt
    creativity_certificate: '/etc/letsencrypt/live/{{ creativity_domain }}/fullchain.pem'
    creativity_certificate_key: '/etc/letsencrypt/live/{{ creativity_domain }}/privkey.pem'
    creativity_youtube_env: /etc/africancreativity/youtube.env
  tasks:
    - name: Validate hostname, port and certificate paths
      ansible.builtin.assert:
        that:
          - creativity_domain is match('^(?=.{1,253}$)([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$')
          - creativity_install is match('^/opt/[A-Za-z0-9_-]+$')
          - creativity_backend_port | int >= 1024
          - creativity_backend_port | int <= 65535
          - creativity_certificate is match('^/etc/letsencrypt/live/[a-z0-9.-]+/fullchain.pem$')
          - creativity_certificate_key is match('^/etc/letsencrypt/live/[a-z0-9.-]+/privkey.pem$')
    - name: Require a healthy installed application
      ansible.builtin.uri:
        url: 'http://127.0.0.1:{{ creativity_backend_port }}/health'
        status_code: 200
        return_content: true
      register: backend_health
      failed_when: backend_health.status != 200 or backend_health.json.status | default('') != 'ok'
    - name: Install HTTPS reverse proxy prerequisites
      ansible.builtin.apt:
        name: [nginx, certbot, openssl]
        state: present
        update_cache: true
    - name: Validate existing Nginx before modifying the target site
      ansible.builtin.command: nginx -t
      changed_when: false
    - name: Find the existing dedicated hostname configuration
      ansible.builtin.script:
        cmd: '{{ playbook_dir }}/../deploy/domain_config.py {{ creativity_domain }}'
        executable: /usr/bin/python3
      changed_when: false
      register: domain_discovery
    - name: Record selected vhost path
      ansible.builtin.set_fact:
        domain_vhost: '{{ domain_discovery.stdout | from_json }}'
    - name: Prepare configuration and challenge directories
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        mode: '0755'
      loop:
        - /etc/nginx/sites-available
        - /etc/nginx/sites-enabled
        - '{{ creativity_challenge_root }}/.well-known/acme-challenge'
    - name: Check prior configuration
      ansible.builtin.stat:
        path: '{{ domain_vhost.config }}'
      register: prior_config
    - name: Read prior configuration for exact recovery
      ansible.builtin.slurp:
        src: '{{ domain_vhost.config }}'
      register: prior_content
      when: prior_config.stat.exists
      no_log: true
    - name: Create protected recovery directory
      ansible.builtin.file:
        path: /var/backups/africancreativity
        state: directory
        mode: '0700'
    - name: Save prior vhost outside active Nginx include directories
      ansible.builtin.copy:
        content: '{{ prior_content.content | b64decode }}'
        dest: '/var/backups/africancreativity/{{ creativity_domain }}-{{ ansible_date_time.iso8601_basic_short }}.conf'
        mode: '0600'
      when: prior_config.stat.exists
      no_log: true
    - name: Check existing certificate files
      ansible.builtin.stat:
        path: '{{ item }}'
      loop: ['{{ creativity_certificate }}', '{{ creativity_certificate_key }}']
      register: cert_files
    - name: Check certificate hostname and renewal window
      ansible.builtin.command:
        argv: [openssl, x509, -in, '{{ creativity_certificate }}', -noout, -checkhost, '{{ creativity_domain }}', -checkend, '86400']
      register: cert_check
      failed_when: false
      changed_when: false
      when: cert_files.results[0].stat.exists and cert_files.results[1].stat.exists
    - name: Activate and verify the requested domain
      block:
        - name: Stage HTTP ACME challenge when a valid certificate is unavailable
          ansible.builtin.copy:
            dest: '{{ domain_vhost.config }}'
            mode: '0644'
            content: |
              server {
                  listen 80;
                  server_name {{ creativity_domain }};
                  location ^~ /.well-known/acme-challenge/ {
                      root {{ creativity_challenge_root }};
                      default_type text/plain;
                  }
                  location / {
                      proxy_pass http://127.0.0.1:{{ creativity_backend_port }};
                      proxy_set_header Host $host;
                      proxy_set_header X-Forwarded-Proto $scheme;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      client_max_body_size 28m;
                  }
              }
          when: cert_check.rc | default(1) != 0
        - name: Enable a newly configured site
          ansible.builtin.file:
            src: '{{ domain_vhost.config }}'
            dest: '/etc/nginx/sites-enabled/{{ creativity_domain }}'
            state: link
          when: not domain_vhost.active
        - name: Check challenge configuration
          ansible.builtin.command: nginx -t
          changed_when: false
          when: cert_check.rc | default(1) != 0
        - name: Start or reload challenge listener
          ansible.builtin.systemd:
            name: nginx
            enabled: true
            state: reloaded
          when: cert_check.rc | default(1) != 0
        - name: Obtain or renew the hostname certificate using HTTP validation
          ansible.builtin.command:
            argv: [certbot, certonly, --webroot, -w, '{{ creativity_challenge_root }}', -d, '{{ creativity_domain }}', --cert-name, '{{ creativity_domain }}', --non-interactive, --agree-tos, --register-unsafely-without-email, --keep-until-expiring]
          when: cert_check.rc | default(1) != 0
        - name: Configure canonical HTTPS application routing
          ansible.builtin.copy:
            dest: '{{ domain_vhost.config }}'
            mode: '0644'
            content: |
              server {
                  listen 80;
                  server_name {{ creativity_domain }};
                  location ^~ /.well-known/acme-challenge/ { root {{ creativity_challenge_root }}; }
                  location / { return 301 https://{{ creativity_domain }}$request_uri; }
              }
              server {
                  listen 443 ssl;
                  server_name {{ creativity_domain }};
                  ssl_certificate {{ creativity_certificate }};
                  ssl_certificate_key {{ creativity_certificate_key }};
                  ssl_protocols TLSv1.2 TLSv1.3;
                  client_max_body_size 28m;
                  location = /api/youtube/callback {
                      access_log off;
                      proxy_pass http://127.0.0.1:{{ creativity_backend_port }};
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto $scheme;
                  }
                  location / {
                      proxy_pass http://127.0.0.1:{{ creativity_backend_port }};
                      proxy_http_version 1.1;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto $scheme;
                      proxy_read_timeout 300s;
                  }
              }
        - name: Validate all Nginx configuration before reloading
          ansible.builtin.command: nginx -t
          changed_when: false
        - name: Reload canonical site
          ansible.builtin.systemd:
            name: nginx
            enabled: true
            state: reloaded
        - name: Verify public HTTPS reaches the application
          ansible.builtin.uri:
            url: 'https://{{ creativity_domain }}/health'
            status_code: 200
            return_content: true
            timeout: 15
          register: public_health
          until: public_health.status | default(0) == 200 and public_health.json.status | default('') == 'ok'
          retries: 5
          delay: 2
        - name: Verify the public homepage branding
          ansible.builtin.uri:
            url: 'https://{{ creativity_domain }}/'
            status_code: 200
            return_content: true
          register: homepage
          failed_when: "homepage.status != 200 or 'The true African mind' not in homepage.content"
      rescue:
        - name: Restore prior vhost contents
          ansible.builtin.copy:
            content: '{{ prior_content.content | b64decode }}'
            dest: '{{ domain_vhost.config }}'
            mode: '0644'
          when: prior_config.stat.exists
          no_log: true
        - name: Remove new vhost when no previous config existed
          ansible.builtin.file:
            path: '{{ domain_vhost.config }}'
            state: absent
          when: not prior_config.stat.exists
        - name: Remove newly enabled site
          ansible.builtin.file:
            path: '/etc/nginx/sites-enabled/{{ creativity_domain }}'
            state: absent
          when: not domain_vhost.active
        - name: Validate restored configuration
          ansible.builtin.command: nginx -t
          changed_when: false
        - name: Reload restored site
          ansible.builtin.systemd:
            name: nginx
            state: reloaded
        - name: Report domain activation failure
          ansible.builtin.fail:
            msg: Domain activation failed and the prior vhost was restored. Confirm the domain's A/AAAA records reach this server and port 80 is reachable for certificate validation. No application records were changed.
    - name: Read installed homepage for canonical URL update
      ansible.builtin.slurp:
        src: '{{ creativity_install }}/static/index.html'
      register: installed_homepage
    - name: Update an existing canonical link
      ansible.builtin.replace:
        path: '{{ creativity_install }}/static/index.html'
        regexp: '<link rel="canonical"[^>]*>'
        replace: '<link rel="canonical" href="https://{{ creativity_domain }}/">'
    - name: Add canonical link when absent
      ansible.builtin.replace:
        path: '{{ creativity_install }}/static/index.html'
        regexp: '</head>'
        replace: '<link rel="canonical" href="https://{{ creativity_domain }}/"></head>'
      when: "'canonical' not in (installed_homepage.content | b64decode)"
    - name: Create certificate renewal deployment hook directory
      ansible.builtin.file:
        path: /etc/letsencrypt/renewal-hooks/deploy
        state: directory
        mode: '0755'
    - name: Reload Nginx after successful certificate renewal
      ansible.builtin.copy:
        dest: /etc/letsencrypt/renewal-hooks/deploy/africancreativity-nginx
        mode: '0755'
        content: |
          #!/bin/sh
          set -eu
          /usr/sbin/nginx -t
          /bin/systemctl reload nginx
    - name: Check available certificate renewal timer
      ansible.builtin.stat:
        path: /lib/systemd/system/certbot.timer
      register: renewal_timer
    - name: Enable installed certificate renewal timer
      ansible.builtin.systemd:
        name: certbot.timer
        state: started
        enabled: true
      when: renewal_timer.stat.exists
    - name: Check existing YouTube runtime configuration
      ansible.builtin.stat:
        path: '{{ creativity_youtube_env }}'
      register: youtube_config
    - name: Update existing YouTube callback without exposing client credentials
      ansible.builtin.lineinfile:
        path: '{{ creativity_youtube_env }}'
        regexp: '^YOUTUBE_REDIRECT_URI='
        line: 'YOUTUBE_REDIRECT_URI=https://{{ creativity_domain }}/api/youtube/callback'
        owner: root
        group: root
        mode: '0600'
      register: youtube_domain_update
      when: youtube_config.stat.exists
      no_log: true
    - name: Reload application when its OAuth callback changed
      ansible.builtin.systemd:
        name: africancreativity
        state: restarted
      when: youtube_domain_update.changed | default(false)
    - name: Report canonical address and external callback registration
      ansible.builtin.debug:
        msg:
          - 'Verified https://{{ creativity_domain }} routes to Africa Creativity on 127.0.0.1:{{ creativity_backend_port }}.'
          - 'If YouTube is configured, register https://{{ creativity_domain }}/api/youtube/callback in its Google OAuth client. Client credentials are preserved.'
          - 'Existing Android APKs retain their compiled hostname and must be rebuilt with the original signing key to use the new domain.'
