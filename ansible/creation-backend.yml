# Africa Creativity integration gateway installer — Debian/Ubuntu + systemd.
# This is a standalone integration scaffold, not a Suno model installation.
# Run from a controller with ansible-core installed:
# ansible-playbook -i inventory.ini creation-backend.yml -e @secrets.yml --ask-vault-pass
# inventory.ini:
# [creation_servers]
# YOUR_SERVER ansible_user=YOUR_SSH_USER
# secrets.yml (encrypt with ansible-vault):
# creation_tenant_tokens:
#   tenant-one: INSERT_A_UNIQUE_RANDOM_TOKEN_OF_AT_LEAST_32_CHARACTERS
# Override creation_tools with documented provider endpoints and API keys.
# Keep unsupported tools disabled. Example shape (endpoint must be real):
# creation_tools:
#   v6:
#     enabled: true
#     endpoint: https://YOUR_PROVIDER/DOCUMENTED_ENDPOINT
#     api_key: YOUR_PROVIDER_KEY
# Gateway binds to localhost:8788; access only through your existing backend.
# Never expose tenant tokens to browsers. Existing backend must enforce user
# permissions and select the tenant token server-side.
# GET /tools with Authorization: Bearer TENANT_TOKEN lists enabled tools.
# POST /jobs body: {"tool":"v6","payload":{DOCUMENTED_PROVIDER_FIELDS}}
# GET /jobs/JOB_ID retrieves tenant-scoped submission status and raw JSON result.
# 'submitted' means provider accepted submission, NOT finished audio generation.
# Provider-specific payload mapping, asynchronous polling/webhooks, asset storage,
# frontend wiring, quotas/billing and custom-model upload/training are NOT included.
# There is no background queue or automatic retry. After unknown outcomes,
# reconcile with the provider before resubmitting to avoid duplicate charges.
# Interrupted 'submitting' rows likewise need reconciliation.
# Back up /var/lib/creation-backend/jobs.sqlite3 with SQLite backup tooling.
# Validation performed: YAML parsing and Python compilation only; no live deploy.
- name: Install creation integration gateway
  hosts: creation_servers
  become: true
  gather_facts: true
  vars:
    creation_tools:
      v6:
        enabled: false
        endpoint: ''
        api_key: ''
      v6-wild:
        enabled: false
        endpoint: ''
        api_key: ''
      v6-mini:
        enabled: false
        endpoint: ''
        api_key: ''
      Custom Models:
        enabled: false
        endpoint: ''
        api_key: ''
      Suno Sounds:
        enabled: false
        endpoint: ''
        api_key: ''
      Extend:
        enabled: false
        endpoint: ''
        api_key: ''
      Cover:
        enabled: false
        endpoint: ''
        api_key: ''
      Replace Section:
        enabled: false
        endpoint: ''
        api_key: ''
  tasks:
  - name: Validate private tenant credentials
    ansible.builtin.assert:
      that:
      - creation_tenant_tokens is defined
      - creation_tenant_tokens | length > 0
      fail_msg: Set creation_tenant_tokens in an encrypted Ansible Vault file.
  - name: Validate token strength
    ansible.builtin.assert:
      that:
      - item.value | length >= 32
    loop: '{{ creation_tenant_tokens | dict2items }}'
    no_log: true
  - name: Validate enabled endpoints
    ansible.builtin.assert:
      that:
      - not item.value.enabled or (item.value.endpoint is match('^https://[^/]+/.+') and item.value.api_key | length > 0)
    loop: '{{ creation_tools | dict2items }}'
    no_log: true
  - name: Install Python runtime
    ansible.builtin.apt:
      name:
      - python3
      state: present
      update_cache: true
  - name: Create service account
    ansible.builtin.user:
      name: creation-backend
      system: true
      create_home: false
      shell: /usr/sbin/nologin
  - name: Create application directory
    ansible.builtin.file:
      path: /opt/creation-backend
      state: directory
      mode: '0755'
  - name: Create secret directory
    ansible.builtin.file:
      path: /etc/creation-backend
      state: directory
      owner: root
      group: creation-backend
      mode: '0750'
  - name: Install gateway
    ansible.builtin.copy:
      dest: /opt/creation-backend/gateway.py
      content: "import hmac, json, sqlite3, urllib.request, urllib.error, uuid\nfrom http.server import BaseHTTPRequestHandler, ThreadingHTTPServer\nfrom pathlib import Path\nCFG=json.loads(Path('/etc/creation-backend/config.json').read_text())\nDB='/var/lib/creation-backend/jobs.sqlite3'\ndef connect():\n    db=sqlite3.connect(DB, timeout=15)\n    db.execute('CREATE TABLE IF NOT EXISTS jobs (id TEXT PRIMARY KEY, tenant TEXT, tool TEXT, status TEXT, result TEXT)')\n    return db\nconnect().close()\nclass Handler(BaseHTTPRequestHandler):\n    def log_message(self, *args): pass\n    def reply(self, code, body):\n        data=json.dumps(body).encode()\n        self.send_response(code)\n        self.send_header('Content-Type','application/json')\n        self.send_header('Content-Length',str(len(data)))\n        self.end_headers()\n        self.wfile.write(data)\n    def tenant(self):\n        supplied=self.headers.get('Authorization','')\n        for tenant, token in CFG['tenant_tokens'].items():\n\
        \            if hmac.compare_digest(supplied, 'Bearer '+token): return tenant\n        return None\n    def do_GET(self):\n        if self.path=='/health': return self.reply(200, {'status':'ok'})\n        tenant=self.tenant()\n        if not tenant: return self.reply(401, {'error':'Unauthorized'})\n        if self.path=='/tools':\n            return self.reply(200, {k:{'enabled':bool(v.get('enabled'))} for k,v in CFG['tools'].items()})\n        if self.path.startswith('/jobs/'):\n            with connect() as db:\n                row=db.execute('SELECT id,tool,status,result FROM jobs WHERE id=? AND tenant=?',(self.path[6:],tenant)).fetchone()\n            if not row: return self.reply(404, {'error':'Unknown job'})\n            return self.reply(200, dict(zip(['id','tool','status','result'], row)))\n        self.reply(404, {'error':'Unknown route'})\n    def do_POST(self):\n        tenant=self.tenant()\n        if not tenant: return self.reply(401, {'error':'Unauthorized'})\n    \
        \    if self.path!='/jobs': return self.reply(404, {'error':'Unknown route'})\n        try:\n            size=int(self.headers.get('Content-Length','0'))\n            if size<1 or size>65536: return self.reply(413, {'error':'Body must be 1–65536 bytes'})\n            body=json.loads(self.rfile.read(size))\n            tool=body['tool']; payload=body['payload']\n            if not isinstance(payload,dict): raise ValueError()\n            conf=CFG['tools'][tool]\n        except (ValueError,KeyError,TypeError): return self.reply(400, {'error':'Supply a configured tool and a payload object'})\n        if not conf.get('enabled'): return self.reply(503, {'error':'Provider integration is not configured'})\n        job=str(uuid.uuid4())\n        with connect() as db: db.execute('INSERT INTO jobs VALUES (?,?,?,?,?)',(job,tenant,tool,'submitting',None))\n        try:\n            # Payload must follow the selected provider's documented request schema.\n            request=urllib.request.Request(conf['endpoint'],data=json.dumps(payload).encode(),headers={'Authorization':'Bearer\
        \ '+conf['api_key'],'Content-Type':'application/json'},method='POST')\n            # Never forward credentials across redirects or retry paid requests.\n            class NoRedirect(urllib.request.HTTPRedirectHandler):\n                def redirect_request(self,*args,**kwargs): return None\n            with urllib.request.build_opener(NoRedirect).open(request,timeout=90) as response:\n                result=response.read(1048577)\n                if len(result)>1048576: raise ValueError('Response too large')\n                result=json.loads(result)\n            status='submitted'\n            result=json.dumps(result)\n        except Exception:\n            # A timeout may have occurred after the provider accepted the request.\n            status='unknown'; result=json.dumps({'error':'Submission outcome unknown; reconcile with provider before resubmitting'})\n        with connect() as db: db.execute('UPDATE jobs SET status=?,result=? WHERE id=?',(status,result,job))\n        self.reply(202,\
        \ {'id':job,'status':status})\nThreadingHTTPServer(('127.0.0.1',8788),Handler).serve_forever()\n"
      mode: '0644'
    notify: Restart creation gateway
  - name: Install provider configuration
    ansible.builtin.copy:
      dest: /etc/creation-backend/config.json
      content: '{{ {''tenant_tokens'': creation_tenant_tokens, ''tools'': creation_tools} | to_nice_json }}'
      owner: root
      group: creation-backend
      mode: '0640'
    no_log: true
    diff: false
    notify: Restart creation gateway
  - name: Install systemd service
    ansible.builtin.copy:
      dest: /etc/systemd/system/creation-backend.service
      mode: '0644'
      content: '[Unit]

        Description=Creation provider integration gateway

        After=network-online.target

        Wants=network-online.target

        [Service]

        User=creation-backend

        Group=creation-backend

        ExecStart=/usr/bin/python3 /opt/creation-backend/gateway.py

        Restart=on-failure

        StateDirectory=creation-backend

        StateDirectoryMode=0700

        UMask=0077

        NoNewPrivileges=true

        ProtectSystem=strict

        ProtectHome=true

        PrivateTmp=true

        [Install]

        WantedBy=multi-user.target

        '
    notify: Restart creation gateway
  - name: Apply service changes
    ansible.builtin.meta: flush_handlers
  - name: Enable gateway
    ansible.builtin.systemd:
      name: creation-backend
      state: started
      enabled: true
      daemon_reload: true
  - name: Verify local health
    ansible.builtin.uri:
      url: http://127.0.0.1:8788/health
      status_code: 200
    register: creation_health
    retries: 10
    delay: 2
    until: creation_health.status == 200
  handlers:
  - name: Restart creation gateway
    ansible.builtin.systemd:
      name: creation-backend
      state: restarted
      daemon_reload: true
