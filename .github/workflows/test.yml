name: Platform checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m unittest discover -s tests -v
      - run: node --check static/app.js && node --check static/studio.js
      - run: npm ci && npm test
        working-directory: tests/browser
      - run: pip install ansible-core
      - run: ansible-playbook -i localhost, --syntax-check ansible/deploy.yml
